<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arc USDC Payment Router</title>
    <!-- Import Ethers.js to interact with the blockchain -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; background: #1a1a2e; color: #fff; }
        .card { background: #16213e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #0f3460; background: #e94560; display: inline-block; padding: 5px 10px; border-radius: 5px; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.9em; }
        input, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 6px; box-sizing: border-box; border: none; }
        input { background: #0f3460; color: #fff; }
        button { background-color: #e94560; color: white; cursor: pointer; font-weight: bold; font-size: 1.1em; transition: 0.2s; }
        button:hover { background-color: #d13050; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #status { margin-top: 20px; font-weight: bold; word-wrap: break-word; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Arc Payment Router</h2>
        <p>Send USDC directly on the Arc Testnet.</p>
        
        <button id="connectBtn">Connect Wallet</button>
        <p id="walletAddress" style="font-size: 0.8em; color: #aaa;"></p>

        <label>Recipient Address:</label>
        <input type="text" id="recipient" placeholder="0x...">

        <label>Amount (USDC):</label>
        <input type="number" id="amount" placeholder="1.5">

        <label>Payment Note:</label>
        <input type="text" id="note" placeholder="e.g. Invoice #123">

        <button id="payBtn" disabled>Send Payment</button>
        
        <p id="status"></p>
    </div>

    <script>
        // INSERT YOUR EXACT DEPLOYED CONTRACT ADDRESS HERE
        const contractAddress = "0x22bf15406209EA6AAe4Ddd18A3f19Da461dD67D0"; 

        // Minimal ABI mapped to your Solidity contract
        const contractABI = [
            "function sendPayment(address payable recipient, string calldata note) external payable"
        ];

        let provider, signer, contract;

        document.getElementById("connectBtn").addEventListener("click", async () => {
            if (typeof window.ethereum !== "undefined") {
                try {
                    await window.ethereum.request({ method: "eth_requestAccounts" });
                    
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                    
                    // Verify the user is connected to Arc Testnet
                    const network = await provider.getNetwork();
                    if (network.chainId !== 5042002) {
                        alert("Please switch your wallet to the Arc Testnet (Chain ID: 5042002)!");
                        return;
                    }

                    const address = await signer.getAddress();
                    document.getElementById("walletAddress").innerText = "Connected: " + address;
                    
                    contract = new ethers.Contract(contractAddress, contractABI, signer);
                    document.getElementById("payBtn").disabled = false;
                    document.getElementById("connectBtn").innerText = "Wallet Connected";
                    document.getElementById("connectBtn").style.backgroundColor = "#28a745";
                } catch (error) {
                    console.error(error);
                    alert("Failed to connect wallet.");
                }
            } else {
                alert("Please install an OKX Wallet or Web3 extension!");
            }
        });

        document.getElementById("payBtn").addEventListener("click", async () => {
            const recipient = document.getElementById("recipient").value;
            const amount = document.getElementById("amount").value;
            const note = document.getElementById("note").value;
            const statusText = document.getElementById("status");

            if (!recipient || !amount) {
                alert("Please fill out the recipient and amount!");
                return;
            }

            try {
                statusText.innerText = "Please approve the transaction in your wallet...";
                statusText.style.color = "#f39c12"; // Orange
                
                const parsedAmount = ethers.utils.parseEther(amount.toString());

                const tx = await contract.sendPayment(recipient, note, { value: parsedAmount });
                
                statusText.innerText = "Transaction sent! Waiting for Arc blockchain confirmation...";
                statusText.style.color = "#3498db"; // Blue
                
                await tx.wait();
                
                statusText.innerText = "Payment Successful! Tx Hash: " + tx.hash;
                statusText.style.color = "#2ecc71"; // Green
            } catch (error) {
                console.error(error);
                statusText.innerText = "Transaction failed or was rejected.";
                statusText.style.color = "#e74c3c"; // Red
            }
        });
    </script>
</body>
</html>
